# One command brings everything up:   docker compose up --build
# First run downloads the Ollama models (several GB) via the "model-setup" service.
# Everything runs on this machine; no service here talks to the internet at runtime.
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    # localhost only, on 27018 so it doesn't clash with a MongoDB already installed on the host.
    # Lets you run the backend outside Docker: MONGO_URI=mongodb://localhost:27018/tapas-kiran
    ports: ["127.0.0.1:27018:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["6333:6333"]

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama-data:/root/.ollama]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 10
    # GPU (NVIDIA): uncomment to use it. Without it the models run on CPU (slow but works).
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Pulls the models once and exits. Re-running is cheap: already-downloaded models are skipped.
  model-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c", "ollama pull $$EMBED_MODEL && ollama pull $$CHAT_MODEL"]
    restart: "no"

  backend:
    build: ./Backend
    depends_on:
      mongo: { condition: service_healthy }
      qdrant: { condition: service_started }
      ollama: { condition: service_healthy }
    # Secrets and model names come from Backend/.env (copy Backend/.env.example).
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/tapas-kiran
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:8080
    volumes:
      # Folder you ingest with:  docker compose exec backend npm run ingest -- /data/docs
      - ${INGEST_DIR:-./sample-docs}:/data/docs:ro
    ports: ["5000:5000"]

  frontend:
    build: ./Frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  mongo-data:
  qdrant-data:
  ollama-data:
