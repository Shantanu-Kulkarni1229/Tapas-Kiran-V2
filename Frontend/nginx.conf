server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m; # PDF uploads

  # Docker's DNS + a variable makes nginx re-resolve "backend" per request, so restarting
  # the backend container doesn't leave nginx pointing at its old IP.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Streamed answers (SSE) must not be buffered, and CPU models can be slow to start.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # React Router: unknown paths load index.html.
  location / {
    try_files $uri /index.html;
  }
}
